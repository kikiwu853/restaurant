<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿公ㄟ熱炒店</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <script src="./js/bootstrap.bundle.min.js"></script>

    <!-- 引入 Google Fonts: 思源黑體 (Noto Sans TC) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            padding-top: 100px;
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif
        }

        section[id] {
            scroll-margin-top: 100px;
            /* 留出 Navbar 的厚度 */
        }

        /*navbar*/
        .rechaos-navbar {
            background-color: #B71C1C !important;
        }

        .rechaos-navbar .navbar-brand {
            color: #FFD700 !important;
            font-weight: bold;
            font-size: 40px;
        }

        .rechaos-navbar .nav-link {
            color: #FFFFFF !important;

        }

        .rechaos-navbar .nav-link:hover {
            color: #FFD700 !important;
        }

        /* 1. 修改按鈕的外框顏色 */
        .navbar-toggler {
            border-color: #ffffff !important;
            /* 按鈕邊框改為白色 */
        }

        /* 2. 修改中間「三條線」為白色 */
        .navbar-toggler-icon {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='%23ffffff' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e") !important;
        }

        /*滑動圖片*/
        .carousel-item img {
            width: 100%;
            height: 500px;
            object-fit: cover;

        }

        /*菜單介紹*/
        .card {
            transition: 0.3s;
            border: none;
            border-radius: 15px;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, .2);
        }

        .card img {
            height: 250px;
            object-fit: cover;
        }

        /*回到置頂*/
        .back-top {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 55px;
            height: 55px;
            background-color: #ffc107;
            color: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-size: 24px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, .3);
            transition: .3s;
            z-index: 999;
        }

        .back-top:hover {
            background-color: #ff9800;
            color: #fff;
            transform: translateY(-5px);
        }

        #faq .accordion-button {
            font-weight: bold;
        }

        #faq .accordion-button:not(.collapsed) {
            background-color: #ffc107;
            color: #000;
        }

        #faq .accordion-item {
            margin-bottom: 10px;
            border-radius: 10px;
            overflow: hidden;
        }

        .food-collage {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            grid-template-rows: repeat(6, 1fr);
            height: 80vh;
            gap: 10px;
        }

        /*六宮格照片*/
        .photo {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .15);
            transition: .35s ease;
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;

            transition:
                transform .5s ease,
                filter .5s ease;
        }

        .photo:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, .25);
        }

        .photo:hover img {
            transform: scale(1.12);
            filter: brightness(1.08);
        }

        /* 左邊一張大圖 */
        .photo1 {
            grid-column: 1;
            grid-row: 1 / 7;
        }

        /* 中間上下兩張 */
        .photo2 {
            grid-column: 2;
            grid-row: 1 / 4;
        }

        .photo3 {
            grid-column: 2;
            grid-row: 4 / 7;
        }

        /* 右邊三張 */
        .photo4 {
            grid-column: 3;
            grid-row: 1 / 3;
        }

        .photo5 {
            grid-column: 3;
            grid-row: 3 / 5;
        }

        .photo6 {
            grid-column: 3;
            grid-row: 5 / 7;
        }

        .photo1 .food-name {
            font-size: 56px;
        }

        .food-name {
            position: absolute;
            right: 15px;
            bottom: 15px;

            color: white;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 2px;



            z-index: 2;
        }

        .photo::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 40%;

            background: linear-gradient(transparent,
                    rgba(0, 0, 0, .75));

        }

        /*關於我們*/
        /* ===== 關於我們 Banner ===== */

        .about {
            background: #fff8ef;
            padding: 60px;
        }

        .about-image img {
            width: 100%;
            height: 450px;
            object-fit: cover;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .15);
        }

        .about-title {
            color: #B71C1C;
            font-size: 42px;
            font-weight: bold;
        }

        .about-subtitle {
            color: #666;
            margin-bottom: 40px;
        }

        .about-item {
            display: flex;
            margin-bottom: 30px;
        }

        .about-icon {
            width: 65px;
            height: 65px;
            background: #FFD700;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            margin-right: 20px;
        }

        .about-item h4 {
            color: #B71C1C;
            font-weight: bold;
        }

        .about-item p {
            margin: 0;
            color: #666;
        }

        /* ========= 菜單 ========= */

        /* ===== 菜單雙欄版 ===== */

        .menu-card {
            background: #fff;
            scroll-margin-top: 180px;
            border-radius: 18px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .08);
        }

        .menu-card h3 {
            color: #B71C1C;
            font-weight: bold;
            text-align: center;
        }

        .menu-card p {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }


        .menu-list {

            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 0 45px;

        }


        .menu-item {

            display: flex;

            align-items: center;

            padding: 12px 0;

        }


        .menu-name {

            white-space: nowrap;

            font-size: 18px;

            font-weight: 500;

        }


        .menu-dot {

            flex: 1;

            border-bottom: 2px dotted #ccc;

            margin: 0 10px;

        }


        .menu-price {

            color: #B71C1C;

            font-size: 18px;

            font-weight: bold;

        }


        .hot {

            color: #ff5722;

        }


        /* 手機版 */

        @media(max-width:768px) {

            .menu-list {

                grid-template-columns: 1fr;

            }

        }

        /*標題樣式*/
        .section-title {
            text-align: center;
            margin: 80px 0 120px;
        }

        .section-en {
            display: block;
            font-size: 13px;
            letter-spacing: 4px;
            color: #C89B3C;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .section-title h2 {
            margin: 0;
            color: #B71C1C;
            font-size: 54px;
            font-weight: 700;
            letter-spacing: 3px;
        }

        /* 六邊形排列 */

        .hex-line {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 18px;
        }

        .hex-line span {

            width: 18px;
            height: 18px;

            background: #F4D35E;

            clip-path: polygon(25% 6%,
                    75% 6%,
                    100% 50%,
                    75% 94%,
                    25% 94%,
                    0 50%);

            transition: .3s;
        }

        /* 中間一顆做品牌色 */

        .hex-line .active {
            background: #B71C1C;
            transform: scale(1.15);
        }

        /* 聯絡表單 */


        .contact-form-box {

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, .1);

        }


        .form-control,
        .form-select {

            border-radius: 12px;

            padding: 12px;

        }



        .form-control:focus,
        .form-select:focus {

            border-color: #FFD700;

            box-shadow:
                0 0 0 .25rem rgba(255, 193, 7, .25);

        }

        /*分類列*/
        .menu-nav {

            position: sticky;

            top: 100px;

            z-index: 1000;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 22px;

            padding: 18px 10px;

            background: #fff;


        }


        .menu-nav a {

            text-decoration: none;

            color: #555;

            font-size: 20px;

            font-weight: 600;

            letter-spacing: 1px;

            transition: .3s;

        }


        .menu-nav a:hover {

            color: #B71C1C;

        }


        .menu-nav span {

            color: #D4AF37;

            font-size: 18px;

        }
    </style>

</head>

<body id="top">
    <!-- 📌 第一區：固定導覽列 Navbar -->

    <nav class="navbar navbar-expand-lg fixed-top rechaos-navbar py-3">
        <div class="container">
            <a class="navbar-brand" href="./index.html"> 永樂街鱔魚麵</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div id="menu" class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="./index.html">首頁</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="./menu.html">美味佳餚</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="./about.html">我們的店</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="./contact.html">聯絡我們</a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- 聯絡我們

    建立表單。
    欄位： 姓名 Email 電話 留言內容
    按鈕：送出 -->

    <section id="massege" class="py-5">

        <div class="container" style="padding-bottom: 200px;">


            <div class="section-title">
                <span class="section-en">CONTACT US</span>

                <h2>聯絡我們</h2>

                <div class="hex-line">
                    <span></span>
                    <span></span>
                    <span class="active"></span>
                    <span></span>
                    <span></span>
                </div>
            </div>




            <div class="row justify-content-center">


                <div class="col-lg-8">


                    <div class="contact-form-box">



                        <form onsubmit="return confirmSubmit(event)">



                            <div class="row">


                                <!-- 姓名 -->

                                <div class="col-md-6 mb-3">


                                    <label class="form-label">
                                        姓名
                                    </label>


                                    <input type="text" class="form-control" placeholder="請輸入姓名" required>


                                </div>





                                <!-- 電話 -->

                                <div class="col-md-6 mb-3">


                                    <label class="form-label">
                                        電話
                                    </label>


                                    <input type="tel" class="form-control" placeholder="09xx-xxx-xxx" required>


                                </div>



                            </div>







                            <!-- Email -->


                            <div class="mb-3">


                                <label class="form-label">
                                    Email
                                </label>


                                <input type="email" class="form-control" placeholder="example@gmail.com">


                            </div>







                            <!-- 下拉選單 -->


                            <div class="mb-3">


                                <label class="form-label">
                                    需求類型
                                </label>


                                <select class="form-select" required>


                                    <option selected disabled>
                                        請選擇需求
                                    </option>


                                    <option>
                                        內用訂位
                                    </option>


                                    <option>
                                        外帶餐點
                                    </option>


                                    <option>
                                        包場詢問
                                    </option>


                                    <option>
                                        菜單詢問
                                    </option>


                                </select>


                            </div>







                            <!-- 留言 -->


                            <div class="mb-4">


                                <label class="form-label">
                                    留言內容
                                </label>


                                <textarea class="form-control" rows="5" placeholder="請輸入您的留言...">
                            </textarea>


                            </div>







                            <div class="text-center">


                                <button type="submit" class="btn btn-warning px-5">


                                    送出詢問


                                </button>


                            </div>




                        </form>



                    </div>



                </div>



            </div>



        </div>
        <script>

            function confirmSubmit(event) {

                event.preventDefault();


                let check =
                    confirm("這是展示用表單，不會實際寄送資料。要查看示範送出效果嗎？");


                if (check) {


                    alert("這是作品集示範表單，尚未串接後端或寄信功能，資料不會實際送出。");


                    event.target.reset();


                }


                return false;

            }

        </script>


    </section>


    <!-- 📌 第十二區：Back To Top 按鈕
    頁面右下角。圖示:⬆
    功能：點擊後回到頁面最上方。固定位置：position: fixed; -->
    <a href="#top" class="back-top">
        <i class="bi bi-arrow-up"></i>
    </a>

    <!-- Footer-->
    <footer class="bg-dark text-center text-white p-4">
        <h4>永樂街鱔魚麵</h4>
        <p>電話：09-32604326</p>
        <p>地址：彰化縣彰化市永樂街18號</p>
        <p>Copyright © 2026 永樂街鱔魚麵</p>
    </footer>


</body>

</html>
